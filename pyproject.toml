[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-chaos-overlay"
version = "2.0.0"
description = "Overlay passif de malus visuels aléatoires pour streamers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "mypy==2.4.1",
    "pyinstaller==6.22.3",
]

[project.gui-scripts]
chaos-overlay = "chaos_overlay.app:main"

[tool.setuptools.packages.find]
include = ["chaos_overlay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
strict = true
files = ["chaos_overlay"]

[[tool.mypy.overrides]]
module = ["customtkinter", "customtkinter.*"]
ignore_missing_imports = true
